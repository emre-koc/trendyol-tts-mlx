    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#23394B"/><stop offset="1" stop-color="#192E40"/></linearGradient>
    <clipPath id="frame"><rect width="1200" height="520" rx="24"/></clipPath>
  </defs>
