<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Trendyol TTS on Apple Silicon</title>
  <desc id="desc">A Turkish text prompt flowing into an audio waveform through the native MLX engine.</desc>
